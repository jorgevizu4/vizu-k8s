---
apiVersion: v1
kind: Service
metadata:
  # Este nombre generará exactamente el DNS: postgresql-svc.langflow.svc.cluster.local
  name: postgresql-svc
  namespace: langflow
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: langflow-postgres
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: langflow
spec:
  serviceName: postgresql-svc
  replicas: 1
  selector:
    matchLabels:
      app: langflow-postgres
  template:
    metadata:
      labels:
        app: langflow-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            # Configura las credenciales iniciales alineadas con tu Langflow
            - name: POSTGRES_USER
              value: "langflow"
            - name: POSTGRES_DB
              value: "langflow-db"
            - name: POSTGRES_PASSWORD
              value: "langflow1234" 
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  # Persistencia real en disco
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        # Cambia por tu StorageClass si no usas la que viene por defecto
        # storageClassName: "local-path" 
        resources:
          requests:
            storage: 5Gi