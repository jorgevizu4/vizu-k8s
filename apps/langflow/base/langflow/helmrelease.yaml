apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langflow
  namespace: langflow

spec:
  interval: 5m
  timeout: 30m
  chart:
    spec:
      chart: langflow-ide
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: langflow
        namespace: flux-system

  install:
    createNamespace: true

  upgrade:
    remediation:
      retries: 3

  values:
    # Imagen global
    langflow:
      global:
        image:
          tag: latest

      backend:
        replicaCount: 1
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 3
            memory: 3Gi
        env:
        - name: LANGFLOW_LOG_LEVEL
          value: "INFO"
        # - name: LANGFLOW_AUTO_LOGIN
        #   value: "true"
        # - name: LANGFLOW_SECRET_KEY
        #   value: "xxxx"
        - name: LANGFLOW_DATABASE_URL
        value: "postgresql://langflow:langflow-postgres@langflow-postgresql:5432/langflow-db"

      frontend:
        replicaCount: 1
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1
            memory: 1Gi
        # env:
        # - name: LANGFLOW_BACKEND_URL
        #   value: "http://langflow-backend:7860"
    postgresql:
      enabled: true
      image:
        repository: postgres
        tag: "16-alpine"
      auth:
        username: "langflow"
        password: "langflow-postgres"
        database: "langflow-db"
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1
          memory: 2Gi

    # Persistencia
    persistence:
      enabled: true
      volumes:
        flows:
          enabled: true
        data:
          enabled: true
        db:
          enabled: true

    # Ingress con nginx de minikube
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: langflow.local
          paths:
            - path: /
              pathType: Prefix